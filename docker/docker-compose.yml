services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:?Set NEXT_PUBLIC_SANITY_DATASET in .env}
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:?Set NEXT_PUBLIC_SANITY_PROJECT_ID in .env}
        NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-2025-01-01}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_BUSINESS_PHONE: ${NEXT_PUBLIC_BUSINESS_PHONE:?Set NEXT_PUBLIC_BUSINESS_PHONE in .env}
        NEXT_PUBLIC_BUSINESS_EMAIL: ${NEXT_PUBLIC_BUSINESS_EMAIL:?Set NEXT_PUBLIC_BUSINESS_EMAIL in .env}
        NEXT_PUBLIC_BUSINESS_ADDRESS: ${NEXT_PUBLIC_BUSINESS_ADDRESS:?Set NEXT_PUBLIC_BUSINESS_ADDRESS in .env}
        NEXT_PUBLIC_GOOGLE_REVIEWS_URL: ${NEXT_PUBLIC_GOOGLE_REVIEWS_URL:?Set NEXT_PUBLIC_GOOGLE_REVIEWS_URL in .env}
        NEXT_PUBLIC_FEATURABLE_WIDGET_ID: ${NEXT_PUBLIC_FEATURABLE_WIDGET_ID:?Set NEXT_PUBLIC_FEATURABLE_WIDGET_ID in .env}
        NEXT_PUBLIC_FEATURABLE_API_URL: ${NEXT_PUBLIC_FEATURABLE_API_URL:?Set NEXT_PUBLIC_FEATURABLE_API_URL in .env}
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:?Set GOOGLE_PLACES_API_KEY in .env}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:?Set GOOGLE_PLACE_ID in .env}
    ports:
      - "3000:3000"
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
